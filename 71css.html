<!DOCTYPE html>
<html>
<head>
    <title>Dark Mode Variables</title>

    <style>
        :root {
            --background: white;
            --text: black;
            --card: #eee;
        }

        body {
            background: var(--background);
            color: var(--text);
            font-family: Arial;
        }

        .dark {
            --background: #222;
            --text: white;
            --card: #333;
        }

        .container {
            padding: 40px;
        }

        .card {
            background: var(--card);
            padding: 30px;
        }
    </style>
</head>

<body>

    <div class="container dark">

        <h1>Dark Mode</h1>

        <div class="card">
            <p>This page uses CSS variables for dark mode.</p>
        </div>

    </div>

</body>
</html>
