<!DOCTYPE html>
<html>
<head>
    <title>Arithmetic Operations</title>
</head>

<body>

    <h1>Arithmetic Operations</h1>

    <p id="output"></p>

    <script>
        let a = 10;
        let b = 5;

        let sum = a + b;
        let difference = a - b;
        let product = a * b;
        let division = a / b;

        document.getElementById("output").innerHTML =
            "Sum = " + sum + "<br>" +
            "Difference = " + difference + "<br>" +
            "Product = " + product + "<br>" +
            "Division = " + division;
    </script>

</body>
</html>
