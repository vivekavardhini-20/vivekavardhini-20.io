<!DOCTYPE html>
<html>
<head>
<style>
    .box {
        width: 100px;
        height: 100px;
        background-color: red;
        position: relative;

        animation-name: move;
        animation-duration: 4s;
        animation-iteration-count: infinite;
    }

    @keyframes move {
        0% {
            left: 0;
        }

        50% {
            left: 300px;
            background-color: blue;
        }

        100% {
            left: 0;
            background-color: green;
        }
    }
</style>
</head>
<body>

<h2>CSS Animation</h2>

<div class="box"></div>

</body>
</html>
