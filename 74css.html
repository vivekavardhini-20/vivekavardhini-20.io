<!DOCTYPE html>
<html>
<head>
    <title>CSS Calc</title>

    <style>
        .container {
            width: calc(100% - 40px);
            margin: 20px;
            background: lightblue;
            padding: 30px;
            box-sizing: border-box;
        }

        .box {
            width: calc(50% - 20px);
            background: orange;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <h1>CSS Calc Function</h1>

    <div class="container">

        <div class="box">
            Width calculated using calc().
        </div>

    </div>

</body>
</html>
