<!DOCTYPE html>
<html>
<head>
    <title>Complete Responsive Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #444;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .hero {
            padding: 80px 20px;
            text-align: center;
            background: #eee;
        }

        .cards {
            display: flex;
            gap: 20px;
            padding: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            width: 250px;
            padding: 30px;
            background: lightblue;
            text-align: center;
            border-radius: 10px;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 600px) {

            nav a {
                display: block;
                margin: 10px;
            }

            .hero {
                padding: 50px 15px;
            }

            .cards {
                flex-direction: column;
                align-items: center;
                padding: 20px;
            }

            .card {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Responsive Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <section class="hero">
        <h2>Welcome!</h2>
        <p>This website is fully responsive.</p>
    </section>

    <section>

        <h2 style="text-align: center;">
            Our Services
        </h2>

        <div class="cards">

            <div class="card">
                <h3>Web Design</h3>
                <p>Modern website design.</p>
            </div>

            <div class="card">
                <h3>Development</h3>
                <p>Responsive web development.</p>
            </div>

            <div class="card">
                <h3>Support</h3>
                <p>Website support and maintenance.</p>
            </div>

        </div>

    </section>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
