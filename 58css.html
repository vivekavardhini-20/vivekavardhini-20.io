<!DOCTYPE html>
<html>
<head>
    <title>Common Elements</title>
</head>

<body>

    <h1>Common Elements</h1>

    <p id="output"></p>

    <script>
        let array1 = [10, 20, 30, 40];
        let array2 = [20, 40, 50, 60];

        let common = array1.filter(function(value) {
            return array2.includes(value);
        });

        document.getElementById("output").innerHTML =
            "Common Elements = " + common;
    </script>

</body>
</html>
