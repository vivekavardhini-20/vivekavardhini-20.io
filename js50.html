<!DOCTYPE html>
<html>
<head>
    <title>Perfect Number</title>
</head>

<body>

    <h1>Perfect Number</h1>

    <p id="output"></p>

    <script>
        let number = 28;
        let sum = 0;

        for (let i = 1; i < number; i++) {

            if (number % i === 0) {
                sum = sum + i;
            }
        }

        if (sum === number) {

            document.getElementById("output").innerHTML =
                number + " is a Perfect Number.";

        } else {

            document.getElementById("output").innerHTML =
                number + " is not a Perfect Number.";
        }
    </script>

</body>
</html>
