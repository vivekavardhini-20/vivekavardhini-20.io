<!DOCTYPE html>
<html>
<head>
<style>
    ul {
        list-style-type: square;
    }

    ol {
        list-style-type: upper-roman;
    }

    table {
        border-collapse: collapse;
        width: 70%;
    }

    th, td {
        border: 2px solid black;
        padding: 12px;
        text-align: center;
    }

    th {
        background-color: lightblue;
    }

    tr:hover {
        background-color: lightyellow;
    }
</style>
</head>
<body>

<h2>CSS Lists</h2>

<ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ul>

<ol>
    <li>Web Design</li>
    <li>Programming</li>
    <li>Database</li>
</ol>

<h2>CSS Table</h2>

<table>
<tr>
    <th>Name</th>
    <th>Age</th>
    <th>Course</th>
</tr>
<tr>
    <td>Rahul</td>
    <td>20</td>
    <td>CSE</td>
</tr>
<tr>
    <td>Priya</td>
    <td>21</td>
    <td>ECE</td>
</tr>
</table>

</body>
</html>
