<!DOCTYPE html>
<html>
<head>
    <title>CSS 22 - Login Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
        }

        .login {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: navy;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: blue;
        }
    </style>
</head>

<body>

<div class="login">

    <h1>Login</h1>

    <form>
        <input type="text" placeholder="Username">

        <input type="password" placeholder="Password">

        <button type="submit">Login</button>
    </form>

</div>

<center>
    <a href="index.html">Back to CSS Programs</a>
</center>

</body>
</html>
