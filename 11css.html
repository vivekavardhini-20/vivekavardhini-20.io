<!DOCTYPE html>
<html>
<head>
<style>
    h1::before {
        content: "★ ";
        color: red;
    }

    h1::after {
        content: " ★";
        color: blue;
    }

    p::first-letter {
        font-size: 40px;
        color: red;
        font-weight: bold;
    }

    p::first-line {
        color: blue;
        font-weight: bold;
    }
</style>
</head>
<body>

<h1>Pseudo Elements</h1>

<p>
    This is an example of CSS pseudo-elements.
    The first letter and first line are styled differently.
</p>

</body>
</html>
