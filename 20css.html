<!DOCTYPE html>
<html>
<head>
    <title>CSS 20 - Personal Portfolio</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 40px;
        }

        section {
            background-color: white;
            margin: 20px auto;
            padding: 30px;
            max-width: 800px;
            border-radius: 10px;
        }

        h2 {
            color: navy;
        }

        .skills {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .skill {
            background-color: lightblue;
            padding: 15px;
            border-radius: 5px;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>My Portfolio</h1>
    <p>Student | Web Developer</p>
</header>

<section>
    <h2>About Me</h2>
    <p>
        I am a student interested in web development
        and programming.
    </p>
</section>

<section>
    <h2>My Skills</h2>

    <div class="skills">
        <div class="skill">HTML</div>
        <div class="skill">CSS</div>
        <div class="skill">JavaScript</div>
        <div class="skill">Python</div>
    </div>
</section>

<section>
    <h2>Contact</h2>
    <p>Email: student@example.com</p>
</section>

<footer>
    <p>My Portfolio</p>
</footer>

<br>

<a href="index.html">Back to CSS Programs</a>

</body>
</html>
