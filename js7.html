<!DOCTYPE html>
<html>
<head>
    <title>Fibonacci Series</title>
</head>

<body>

    <h1>Fibonacci Series</h1>

    <p id="output"></p>

    <script>
        let n = 10;

        let first = 0;
        let second = 1;
        let series = "";

        for (let i = 1; i <= n; i++) {

            series = series + first + " ";

            let next = first + second;

            first = second;
            second = next;
        }

        document.getElementById("output").innerHTML =
            series;
    </script>

</body>
</html>
