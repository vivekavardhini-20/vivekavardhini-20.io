<!DOCTYPE html>
<html>
<head>
    <title>Quiz</title>
</head>

<body>

    <h1>JavaScript Quiz</h1>

    <p>What is the correct way to declare a variable in JavaScript?</p>

    <button onclick="checkAnswer('var')">var</button>
    <button onclick="checkAnswer('print')">print</button>
    <button onclick="checkAnswer('display')">display</button>

    <p id="result"></p>

    <script>
        function checkAnswer(answer) {

            if (answer === "var") {
                document.getElementById("result").innerHTML =
                    "Correct Answer!";
            } else {
                document.getElementById("result").innerHTML =
                    "Wrong Answer!";
            }
        }
    </script>

</body>
</html>
