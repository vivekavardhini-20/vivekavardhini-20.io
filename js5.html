<!DOCTYPE html>
<html>
<head>
    <title>Positive Negative or Zero</title>
</head>

<body>

    <h1>Check Number</h1>

    <p id="output"></p>

    <script>
        let number = -8;

        if (number > 0) {
            document.getElementById("output").innerHTML =
                "The number is Positive";
        } else if (number < 0) {
            document.getElementById("output").innerHTML =
                "The number is Negative";
        } else {
            document.getElementById("output").innerHTML =
                "The number is Zero";
        }
    </script>

</body>
</html>
