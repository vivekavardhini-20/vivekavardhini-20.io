<!DOCTYPE html>
<html>
<head>
    <title>Countdown</title>
</head>

<body>

    <h1>Countdown Timer</h1>

    <h2 id="countdown">10</h2>

    <script>
        let count = 10;

        let timer = setInterval(function() {

            document.getElementById("countdown").innerHTML = count;

            count--;

            if (count < 0) {

                clearInterval(timer);

                document.getElementById("countdown").innerHTML =
                    "Time's Up!";
            }

        }, 1000);
    </script>

</body>
</html>
