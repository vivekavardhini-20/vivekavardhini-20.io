<!DOCTYPE html>
<html>
<head>
<style>
    .box1 {
        width: 300px;
        height: 150px;
        background-color: lightblue;
    }

    .box2 {
        width: 50%;
        max-width: 500px;
        min-width: 200px;
        height: 100px;
        background-color: lightgreen;
    }

    .box3 {
        box-sizing: border-box;
        width: 300px;
        height: 150px;
        padding: 20px;
        border: 5px solid red;
    }
</style>
</head>
<body>

<div class="box1">Fixed Width and Height</div>
<br>

<div class="box2">Percentage and Min/Max Width</div>
<br>

<div class="box3">Box Sizing</div>

</body>
</html>
