<!DOCTYPE html>
<html>
<head>
    <title>Click Event</title>
</head>

<body>

    <h1>JavaScript Click Event</h1>

    <button onclick="showMessage()">Click Me</button>

    <p id="output"></p>

    <script>
        function showMessage() {
            document.getElementById("output").innerHTML =
                "Button was clicked!";
        }
    </script>

</body>
</html>
