<!DOCTYPE html>
<html>
<head>
    <title>Sum of Digits</title>
</head>

<body>

    <h1>Sum of Digits</h1>

    <p id="output"></p>

    <script>
        let number = 12345;
        let sum = 0;

        while (number > 0) {
            sum = sum + (number % 10);
            number = Math.floor(number / 10);
        }

        document.getElementById("output").innerHTML =
            "Sum of digits = " + sum;
    </script>

</body>
</html>
