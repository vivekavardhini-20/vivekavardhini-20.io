<!DOCTYPE html>
<html>
<head>
<style>
    .box {
        width: 150px;
        height: 150px;
        background-color: blue;
        transition: 1s;
        margin: 50px;
    }

    .box:hover {
        transform: rotate(45deg) scale(1.2);
        background-color: red;
    }
</style>
</head>
<body>

<h2>Hover over the box</h2>

<div class="box"></div>

</body>
</html>
