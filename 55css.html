<!DOCTYPE html>
<html>
<head>
    <title>Remove Duplicates</title>
</head>

<body>

    <h1>Remove Duplicates</h1>

    <p id="output"></p>

    <script>
        let numbers = [10, 20, 10, 30, 20, 40];

        let uniqueNumbers = [...new Set(numbers)];

        document.getElementById("output").innerHTML =
            "Original Array = " + numbers + "<br>" +
            "After Removing Duplicates = " + uniqueNumbers;
    </script>

</body>
</html>
