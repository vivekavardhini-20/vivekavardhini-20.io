<!DOCTYPE html>
<html>
<head>
<style>
    a:link {
        color: blue;
    }

    a:visited {
        color: purple;
    }

    a:hover {
        color: red;
    }

    a:active {
        color: green;
    }

    input:focus {
        background-color: yellow;
        border: 3px solid blue;
    }
</style>
</head>
<body>

<a href="https://example.com">Visit Website</a>

<br><br>

<input type="text" placeholder="Click here">

</body>
</html>
