<!DOCTYPE html>
<html>
<head>
    <title>Functions</title>
</head>

<body>

    <h1>JavaScript Function</h1>

    <p id="output"></p>

    <script>
        function addNumbers(a, b) {
            return a + b;
        }

        let result = addNumbers(10, 20);

        document.getElementById("output").innerHTML =
            "Sum = " + result;
    </script>

</body>
</html>
