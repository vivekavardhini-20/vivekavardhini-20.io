<!DOCTYPE html>
<html>
<head>
<style>
    /* Element selector */
    p {
        color: blue;
    }

    /* ID selector */
    #heading {
        color: red;
    }

    /* Class selector */
    .text {
        background-color: yellow;
    }

    /* Universal selector */
    * {
        font-family: Arial;
    }

    /* Group selector */
    h2, h3 {
        color: purple;
    }
</style>
</head>
<body>

<h1 id="heading">ID Selector</h1>
<p>Element Selector</p>
<p class="text">Class Selector</p>
<h2>Group Selector</h2>
<h3>Group Selector</h3>

</body>
</html>
