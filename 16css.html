<!DOCTYPE html>
<html>
<head>
<style>
    .container {
        display: flex;
        gap: 20px;
    }

    .box {
        flex: 1;
        padding: 50px;
        background-color: lightblue;
        text-align: center;
    }

    /* Mobile */
    @media screen and (max-width: 600px) {
        .container {
            flex-direction: column;
        }

        .box {
            background-color: lightgreen;
        }
    }
</style>
</head>
<body>

<h1>Responsive Website</h1>

<div class="container">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
</div>

</body>
</html>
