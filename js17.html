<!DOCTYPE html>
<html>
<head>
    <title>String Methods</title>
</head>

<body>

    <h1>String Methods</h1>

    <p id="output"></p>

    <script>
        let text = "JavaScript";

        let upper = text.toUpperCase();
        let lower = text.toLowerCase();
        let length = text.length;

        document.getElementById("output").innerHTML =
            "Original = " + text + "<br>" +
            "Uppercase = " + upper + "<br>" +
            "Lowercase = " + lower + "<br>" +
            "Length = " + length;
    </script>

</body>
</html>
