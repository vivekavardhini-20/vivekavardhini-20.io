<!DOCTYPE html>
<html>
<head>
    <title>CSS 23 - Product Card</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .card {
            width: 300px;
            margin: 50px auto;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px gray;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
        }

        .price {
            color: green;
            font-size: 24px;
            font-weight: bold;
        }

        button {
            background-color: navy;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: green;
        }
    </style>
</head>

<body>

<div class="card">

    <img src="https://via.placeholder.com/300x200" alt="Product">

    <div class="card-content">

        <h2>Smart Watch</h2>

        <p>A stylish smart watch with useful features.</p>

        <p class="price">₹1999</p>

        <button>Buy Now</button>

    </div>

</div>

<center>
    <a href="index.html">Back to CSS Programs</a>
</center>

</body>
</html>
