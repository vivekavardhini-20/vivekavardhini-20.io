<!DOCTYPE html>
<html>
<head>
    <title>CSS 21 - Student Profile</title>

    <style>
        body {
            font-family: Arial;
            background-color: #eeeeee;
        }

        .profile {
            width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        .profile h1 {
            color: navy;
        }

        .profile p {
            font-size: 18px;
        }

        .details {
            text-align: left;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="profile">

    <h1>Student Profile</h1>

    <div class="details">
        <p><b>Name:</b> Viveka</p>
        <p><b>Course:</b> Computer Science</p>
        <p><b>College:</b> ABC College</p>
        <p><b>Year:</b> 2nd Year</p>
        <p><b>Email:</b> student@example.com</p>
    </div>

</div>

<a href="index.html">Back to CSS Programs</a>

</body>
</html>
