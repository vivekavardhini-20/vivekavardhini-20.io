<!DOCTYPE html>
<html>
<head>
    <title>Change Background Color</title>
</head>

<body>

    <h1>Change Background Color</h1>

    <button onclick="changeColor()">Change Color</button>

    <script>
        function changeColor() {
            document.body.style.backgroundColor = "lightblue";
        }
    </script>

</body>
</html>
