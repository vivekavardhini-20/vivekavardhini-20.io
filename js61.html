<!DOCTYPE html>
<html>
<head>
    <title>Vowels and Consonants</title>
</head>

<body>

    <h1>Vowels and Consonants</h1>

    <p id="output"></p>

    <script>
        let text = "JavaScript";
        let vowels = 0;
        let consonants = 0;

        for (let char of text.toLowerCase()) {

            if (char >= "a" && char <= "z") {

                if ("aeiou".includes(char)) {
                    vowels++;
                } else {
                    consonants++;
                }
            }
        }

        document.getElementById("output").innerHTML =
            "Text = " + text + "<br>" +
            "Vowels = " + vowels + "<br>" +
            "Consonants = " + consonants;
    </script>

</body>
</html>
