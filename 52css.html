<!DOCTYPE html>
<html>
<head>
    <title>Power of a Number</title>
</head>

<body>

    <h1>Power of a Number</h1>

    <p id="output"></p>

    <script>
        let number = 2;
        let power = 5;

        let result = Math.pow(number, power);

        document.getElementById("output").innerHTML =
            number + " raised to the power " + power +
            " = " + result;
    </script>

</body>
</html>
