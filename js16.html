<!DOCTYPE html>
<html>
<head>
    <title>Arrow Functions</title>
</head>

<body>

    <h1>Arrow Function</h1>

    <p id="output"></p>

    <script>
        const addNumbers = (a, b) => a + b;

        let result = addNumbers(15, 25);

        document.getElementById("output").innerHTML =
            "Sum = " + result;
    </script>

</body>
</html>
