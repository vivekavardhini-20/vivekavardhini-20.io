<!DOCTYPE html>
<html>
<head>
    <title>Types of CSS</title>

    <!-- Internal CSS -->
    <style>
        h2 {
            color: blue;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 style="color:red;">Inline CSS</h1>

    <h2>Internal CSS</h2>

    <p>This paragraph uses External CSS.</p>

</body>
</html>
