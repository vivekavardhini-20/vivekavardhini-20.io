<!DOCTYPE html>
<html>
<head>
    <title>Sum and Average</title>
</head>

<body>

    <h1>Array Sum and Average</h1>

    <p id="output"></p>

    <script>
        let numbers = [10, 20, 30, 40, 50];

        let sum = 0;

        for (let i = 0; i < numbers.length; i++) {
            sum = sum + numbers[i];
        }

        let average = sum / numbers.length;

        document.getElementById("output").innerHTML =
            "Sum = " + sum + "<br>" +
            "Average = " + average;
    </script>

</body>
</html>
