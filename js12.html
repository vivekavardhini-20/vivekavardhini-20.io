<!DOCTYPE html>
<html>
<head>
    <title>Largest and Smallest Array</title>
</head>

<body>

    <h1>Largest and Smallest Number</h1>

    <p id="output"></p>

    <script>
        let numbers = [25, 10, 45, 5, 30];

        let largest = Math.max(...numbers);
        let smallest = Math.min(...numbers);

        document.getElementById("output").innerHTML =
            "Array = " + numbers + "<br>" +
            "Largest = " + largest + "<br>" +
            "Smallest = " + smallest;
    </script>

</body>
</html>
