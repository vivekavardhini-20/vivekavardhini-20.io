<!DOCTYPE html>
<html>
<head>
<style>
    .container {
        display: flex;
        justify-content: space-around;
        align-items: center;
        gap: 20px;
        height: 300px;
        background-color: lightgray;
    }

    .box {
        width: 100px;
        height: 100px;
        background-color: steelblue;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
    }
</style>
</head>
<body>

<div class="container">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
</div>

</body>
</html>
