<!DOCTYPE html>
<html>
<head>
    <title>Fetch API</title>
</head>

<body>

    <h1>Fetch API</h1>

    <p id="output">Loading data...</p>

    <script>
        fetch("https://jsonplaceholder.typicode.com/posts/1")
            .then(response => response.json())
            .then(data => {
                document.getElementById("output").innerHTML =
                    "Title: " + data.title;
            })
            .catch(error => {
                document.getElementById("output").innerHTML =
                    "Error loading data.";
            });
    </script>

</body>
</html>
