<!DOCTYPE html>
<html>
<head>
    <title>Factorial</title>
</head>

<body>

    <h1>Factorial of a Number</h1>

    <p id="output"></p>

    <script>
        let number = 5;
        let factorial = 1;

        for (let i = 1; i <= number; i++) {
            factorial = factorial * i;
        }

        document.getElementById("output").innerHTML =
            "Factorial of " + number + " = " + factorial;
    </script>

</body>
</html>
