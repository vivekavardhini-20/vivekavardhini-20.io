<!DOCTYPE html>
<html>
<head>
<style>
    .static {
        position: static;
        background: lightgray;
        padding: 10px;
    }

    .relative {
        position: relative;
        left: 50px;
        background: lightblue;
        padding: 10px;
    }

    .container {
        position: relative;
        height: 200px;
        background: lightyellow;
    }

    .absolute {
        position: absolute;
        top: 50px;
        right: 30px;
        background: lightgreen;
        padding: 15px;
    }

    .fixed {
        position: fixed;
        bottom: 10px;
        right: 10px;
        background: red;
        color: white;
        padding: 10px;
    }

    .sticky {
        position: sticky;
        top: 0;
        background: orange;
        padding: 10px;
    }
</style>
</head>
<body>

<div class="static">Static</div>

<div class="relative">Relative</div>

<div class="sticky">Sticky</div>

<div class="container">
    <div class="absolute">Absolute</div>
</div>

<div class="fixed">Fixed</div>

<p style="height:800px;">Scroll the page</p>

</body>
</html>
