<!DOCTYPE html>
<html>
<head>
    <title>CSS 24 - Responsive Photo Gallery</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        @media (max-width: 800px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<h1>Responsive Photo Gallery</h1>

<div class="gallery">

    <img src="https://picsum.photos/300/200?1" alt="Image 1">
    <img src="https://picsum.photos/300/200?2" alt="Image 2">
    <img src="https://picsum.photos/300/200?3" alt="Image 3">
    <img src="https://picsum.photos/300/200?4" alt="Image 4">
    <img src="https://picsum.photos/300/200?5" alt="Image 5">
    <img src="https://picsum.photos/300/200?6" alt="Image 6">
    <img src="https://picsum.photos/300/200?7" alt="Image 7">
    <img src="https://picsum.photos/300/200?8" alt="Image 8">

</div>

<br>

<a href="index.html">Back to CSS Programs</a>

</body>
</html>
