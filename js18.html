<!DOCTYPE html>
<html>
<head>
    <title>Array Methods</title>
</head>

<body>

    <h1>Array Methods</h1>

    <p id="output"></p>

    <script>
        let fruits = ["Apple", "Banana", "Mango"];

        fruits.push("Orange");

        let result = fruits.join(", ");

        document.getElementById("output").innerHTML =
            "Fruits = " + result;
    </script>

</body>
</html>
