<!DOCTYPE html>
<html>
<head>
<style>
    img {
        width: 150px;
        height: 150px;
        float: left;
        margin-right: 20px;
    }

    .clear {
        clear: both;
    }
</style>
</head>
<body>

<img src="https://via.placeholder.com/150">

<p>
    This text flows around the image because the image is floated to the left.
</p>

<div class="clear"></div>

<h2>Clear Property</h2>

<p>
    This content appears below the floated image.
</p>

</body>
</html>
