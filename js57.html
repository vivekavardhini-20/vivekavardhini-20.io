<!DOCTYPE html>
<html>
<head>
    <title>Array Frequency</title>
</head>

<body>

    <h1>Frequency of Array Elements</h1>

    <p id="output"></p>

    <script>
        let numbers = [10, 20, 10, 30, 20, 10];

        let frequency = {};

        for (let number of numbers) {

            if (frequency[number]) {
                frequency[number]++;
            } else {
                frequency[number] = 1;
            }
        }

        let result = "";

        for (let number in frequency) {
            result += number + " occurs " +
                      frequency[number] + " time(s)<br>";
        }

        document.getElementById("output").innerHTML = result;
    </script>

</body>
</html>
