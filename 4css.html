<!DOCTYPE html>
<html>
<head>
<style>
    h1 {
        font-family: Arial;
        font-size: 40px;
        font-weight: bold;
        font-style: italic;
        color: blue;
        text-align: center;
        text-decoration: underline;
        text-transform: uppercase;
    }

    p {
        line-height: 2;
        letter-spacing: 2px;
        word-spacing: 5px;
        text-align: justify;
    }
</style>
</head>
<body>

<h1>Text Formatting</h1>

<p>
    This paragraph demonstrates different font and text properties in CSS.
</p>

</body>
</html>
