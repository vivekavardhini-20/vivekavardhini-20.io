<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Objects</title>
</head>

<body>

    <h1>JavaScript Object</h1>

    <p id="output"></p>

    <script>
        let student = {
            name: "Rahul",
            age: 20,
            course: "Computer Science"
        };

        document.getElementById("output").innerHTML =
            "Name = " + student.name + "<br>" +
            "Age = " + student.age + "<br>" +
            "Course = " + student.course;
    </script>

</body>
</html>
