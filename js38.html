<!DOCTYPE html>
<html>
<head>
    <title>Classes and Objects</title>
</head>

<body>

    <h1>Classes and Objects</h1>

    <p id="output"></p>

    <script>
        class Student {

            constructor(name, age) {
                this.name = name;
                this.age = age;
            }

            display() {
                return "Name: " + this.name +
                       "<br>Age: " + this.age;
            }
        }

        let student1 = new Student("Rahul", 20);

        document.getElementById("output").innerHTML =
            student1.display();
    </script>

</body>
</html>
