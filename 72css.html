<!DOCTYPE html>
<html>
<head>
    <title>Responsive Typography</title>

    <style>
        body {
            font-family: Arial;
        }

        h1 {
            font-size: 6vw;
        }

        p {
            font-size: 2vw;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 10vw;
            }

            p {
                font-size: 5vw;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Heading</h1>

    <p>
        The text size changes according to the screen size.
    </p>

</body>
</html>
