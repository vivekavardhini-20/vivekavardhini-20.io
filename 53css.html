<!DOCTYPE html>
<html>
<head>
    <title>Count Digits</title>
</head>

<body>

    <h1>Count Digits</h1>

    <p id="output"></p>

    <script>
        let number = 12345;

        let count = number.toString().length;

        document.getElementById("output").innerHTML =
            "Number = " + number + "<br>" +
            "Number of digits = " + count;
    </script>

</body>
</html>
