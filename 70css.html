<!DOCTYPE html>
<html>
<head>
    <title>CSS Modal</title>

    <style>
        .button {
            padding: 12px 20px;
            background: blue;
            color: white;
            text-decoration: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
        }

        .modal:target {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content {
            background: white;
            padding: 30px;
            width: 300px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>CSS Only Modal</h1>

    <a href="#popup" class="button">Open Modal</a>

    <div id="popup" class="modal">

        <div class="content">

            <h2>Hello!</h2>

            <p>This modal uses only CSS.</p>

            <a href="#">Close</a>

        </div>

    </div>

</body>
</html>
