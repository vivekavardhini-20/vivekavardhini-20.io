<!DOCTYPE html>
<html>
<head>
<style>
    * {
        box-sizing: border-box;
    }

    nav {
        background-color: #333;
    }

    ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
    }

    li {
        flex: 1;
    }

    a {
        display: block;
        color: white;
        text-align: center;
        padding: 15px;
        text-decoration: none;
    }

    a:hover {
        background-color: green;
    }

    /* Responsive */
    @media screen and (max-width: 600px) {
        ul {
            flex-direction: column;
        }

        a {
            text-align: left;
        }
    }
</style>
</head>
<body>

<nav>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

</body>
</html>
